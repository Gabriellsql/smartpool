<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPool</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;

    /* FONDO PROFESIONAL */
    background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
    url('fondo2.jpg') no-repeat center center fixed;

    background-size:cover;
}

/* TEXTO */
.text{
    font-size:3rem;
    max-width:800px;
}

/* LETRAS */
.text span{
    opacity:0;
    display:inline-block;
    transform:translateY(20px);
    animation:fadeUp 0.5s forwards;
    margin-right:2px; /* 🔥 separación extra */
}

/* ANIMACIÓN */
@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<h1 class="text" id="texto"></h1>

<script>
// TEXTO
const mensaje = "Tu alberca, siempre perfecta";
const contenedor = document.getElementById("texto");

// ANIMACIÓN LETRA POR LETRA CON ESPACIOS CORRECTOS
mensaje.split("").forEach((letra, i) => {
    const span = document.createElement("span");

    // 🔥 AQUÍ LA CLAVE
    span.innerHTML = (letra === " ") ? "&nbsp;" : letra;

    span.style.animationDelay = (i * 0.08) + "s";

    contenedor.appendChild(span);
});
</script>

</body>
</html>
