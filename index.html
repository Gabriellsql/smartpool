<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPool</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    overflow-x:hidden;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;

    background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
    url('fondo2.jpg') no-repeat center center fixed;

    background-size:cover;
}

/* TEXTO PRINCIPAL */
.text{
    font-size:3rem;
    max-width:800px;
}

.text span{
    opacity:0;
    display:inline-block;
    transform:translateY(20px);
    animation:fadeUp 0.5s forwards;
    margin-right:2px;
}

/* SUBTÍTULO */
.subtitle{
    margin-top:20px;
    font-size:1.2rem;
    opacity:0;
    transform:translateY(20px);
    animation:fadeUp 1s forwards;
    animation-delay:2.5s;
}

/* INDICADOR SCROLL */
.scroll-indicator{
    position:absolute;
    bottom:30px;
    font-size:0.9rem;
    opacity:0;
    animation:fadeUp 1s forwards;
    animation-delay:3.5s;
}

/* SECCIÓN SIGUIENTE */
.next{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:2rem;
    background:#f4f8fb;
    color:#0a2540;
    opacity:0;
    transform:translateY(50px);
    transition:1s;
}

.next.show{
    opacity:1;
    transform:translateY(0);
}

/* ANIMACIÓN */
@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">

<h1 class="text" id="texto"></h1>

<p class="subtitle">
Monitorea tu alberca en tiempo real sin complicaciones
</p>

<div class="scroll-indicator">
Desliza hacia abajo
</div>

</section>

<!-- SIGUIENTE SECCIÓN -->
<section class="next" id="next">
Control total del agua desde tu celular
</section>

<script>
// TEXTO ANIMADO
const mensaje = "Tu alberca, siempre perfecta";
const contenedor = document.getElementById("texto");

mensaje.split("").forEach((letra, i) => {
    const span = document.createElement("span");
    span.innerHTML = letra === " " ? "&nbsp;" : letra;
    span.style.animationDelay = (i * 0.08) + "s";
    contenedor.appendChild(span);
});

// TRANSICIÓN AL HACER SCROLL
window.addEventListener("scroll", () => {
    const next = document.getElementById("next");
    const pos = next.getBoundingClientRect().top;

    if(pos < window.innerHeight - 100){
        next.classList.add("show");
    }
});
</script>

</body>
</html>
