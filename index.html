<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPool</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow-x:hidden;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;

    background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
    url('fondo2.jpg');

    background-size:cover;
    background-position:center;
}

/* TITULO */
.title{
    font-size:3rem;
    max-width:800px;
}

.title span{
    opacity:0;
    display:inline-block;
    transform:translateY(20px);
    animation:fadeUp 0.5s forwards;
}

/* SUBTITULO */
.subtitle{
    margin-top:20px;
    font-size:1.2rem;
    opacity:0;
    animation:fadeUp 1s forwards;
    animation-delay:2s;
}

/* MOCKUP */
.phone{
    width:220px;
    margin-top:40px;
    opacity:0;
    transform:translateY(50px);
    animation:fadeUp 1s forwards;
    animation-delay:3s;
    transition:0.3s;
}

/* APPLE SCROLL */
.apple{
    height:200vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.phone-big{
    width:300px;
    position:sticky;
    top:100px;
}

/* BENEFICIOS */
.features{
    padding:100px 40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
    background:#f4f8fb;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    transform:translateY(50px);
    opacity:0;
    transition:0.6s;
}

.card.show{
    transform:translateY(0);
    opacity:1;
}

/* ANIMACIONES */
@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">

<h1 class="title" id="texto"></h1>

<p class="subtitle">
Monitorea pH y cloro en tiempo real desde tu celular
</p>

<img class="phone" src="https://i.imgur.com/2yaf2wb.png">

</section>

<!-- SCROLL -->
<section class="apple">
<img src="https://i.imgur.com/2yaf2wb.png" class="phone-big" id="phone">
</section>

<!-- BENEFICIOS -->
<section class="features">
<div class="card">Monitoreo en tiempo real</div>
<div class="card">Inteligencia automática</div>
<div class="card">Historial de datos</div>
<div class="card">Ahorro en químicos</div>
</section>

<script>
// TEXTO ANIMADO
const mensaje = "Tu alberca, siempre perfecta";
const contenedor = document.getElementById("texto");

mensaje.split("").forEach((letra, i) => {
    const span = document.createElement("span");
    span.innerHTML = letra === " " ? "&nbsp;" : letra;
    span.style.animationDelay = (i * 0.08) + "s";
    contenedor.appendChild(span);
});

// SCROLL
window.addEventListener("scroll", () => {
    let scroll = window.scrollY;
    let phone = document.getElementById("phone");
    phone.style.transform = `scale(${1 + scroll/2000})`;
});

// ANIMACIÓN TARJETAS
const cards = document.querySelectorAll('.card');

window.addEventListener('scroll', () => {
    cards.forEach(card => {
        let pos = card.getBoundingClientRect().top;
        if(pos < window.innerHeight - 100){
            card.classList.add('show');
        }
    });
});
</script>

</body>
</html>
